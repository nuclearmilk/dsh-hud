name: Test & Release

on:
  # 1. 每次推送到 main 分支：自动跑测试（不发版）
  push:
    branches: [main]
    tags:
      - 'v*' # 2. 推送 v 开头的标签（如 v1.8.0）：自动测试 + 打包 + 发 Release
  # 3. 支持在 GitHub Actions 网页上手动点按钮触发
  workflow_dispatch:
    inputs:
      tag:
        description: '可选：手动指定要打包发布的已有 tag（如 v1.8.0，留空则只跑测试）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 运行单元测试
        run: npm test

      - name: 打包 tgz 离线安装包
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        id: pack
        run: |
          TGZ=$(npm pack --silent | tail -n 1)
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
          sha256sum "$TGZ"

      - name: 自动创建/更新 GitHub Release 并上传 tgz
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TGZ" --clobber
          else
            gh release create "$TAG" "$TGZ" \
              --title "$TAG" \
              --generate-notes
          fi
